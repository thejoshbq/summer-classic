<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Classic — Pitching Rotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/brand.css">
<link rel="stylesheet" href="/shared/shell.css">
<style>
  .badge-inning {
    background: var(--teal);
    border-radius: 8px;
    padding: 0.5em 1em;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 5.5vw;
  }
  .badge-inning .label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(10px, 1vw, 14px);
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .badge-inning .half {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(12px, 1.2vw, 18px);
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }
  .badge-inning .num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 3.5vw, 50px);
    color: #fff;
    line-height: 1;
  }
  .badge-final {
    background: var(--red);
    border-radius: 8px;
    padding: 0.7em 1.4em;
  }
  .badge-final .text {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 3vw, 42px);
    color: #fff;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .score-strip {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 1.2%;
    padding: 2.4% 2.6% 1%;
  }
  .score-strip-team {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 2.2vw, 32px);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.7);
  }
  .score-strip-team.active { color: var(--orange); }
  .score-strip-total {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 4vw, 56px);
    color: rgba(255,255,255,0.55);
    line-height: 1;
  }
  .score-strip-total.active { color: var(--orange); }
  .score-strip-sep {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(22px, 2.5vw, 32px);
    color: rgba(255,255,255,0.2);
  }

  .matchup-panel {
    display: flex;
    align-items: stretch;
    gap: 1.5%;
    padding: 2% 2.6%;
    flex: 1;
  }
  .matchup-col {
    flex: 1;
    background: var(--dark-navy);
    border-radius: 8px;
    padding: 2em 1.4em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
    text-align: center;
  }
  .matchup-role {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(12px, 1.2vw, 16px);
    color: var(--teal);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .matchup-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 64px);
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .matchup-ondeck {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: clamp(14px, 1.6vw, 22px);
    color: rgba(255,255,255,0.4);
  }
  .matchup-ondeck .od-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(10px, 0.95vw, 13px);
    color: var(--teal);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-right: 0.5em;
  }
  .matchup-vs {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: clamp(12px, 1.2vw, 16px);
    color: var(--teal);
    letter-spacing: 0.2em;
    align-self: center;
  }
  .v-divider { width: 1px; background: rgba(25,106,115,0.3); }
</style>
</head>
<body>
<div class="board" id="board"></div>

<script src="/shared/poll.js"></script>
<script>
function header(g) {
  let badge = '';
  if (g.status === 'live') {
    badge = `
      <div class="badge-inning">
        <span class="label">Inning</span>
        <span class="half">${g.currentHalf === 'top' ? 'Top' : 'Bottom'}</span>
        <span class="num">${g.currentInning}</span>
      </div>`;
  } else if (g.status === 'final') {
    badge = `<div class="badge-final"><span class="text">Final</span></div>`;
  } else {
    badge = `
      <div class="day-badge">
        <span class="day-label">Day</span>
        <span class="day-number">6</span>
      </div>`;
  }
  return `
    <header class="board-header">
      <div class="header-brand">
        <img src="/shared/logo.png" class="header-logo" alt="Lumber Jill's">
        <div class="header-left">
          <span class="venue-name">Lumber Jill's</span>
          <span class="board-title">Pitching Rotation</span>
          <span class="board-subtitle">Day 6 — Championship Game</span>
        </div>
      </div>
      ${badge}
    </header>`;
}

function scoreStrip(g) {
  const vActive = g.battingSide === 'visitor';
  const hActive = g.battingSide === 'home';
  return `
    <div class="score-strip">
      <span class="score-strip-team${vActive ? ' active' : ''}">${esc(g.visitorName) || 'Visitor'}</span>
      <span class="score-strip-total${vActive ? ' active' : ''}">${g.visitorTotal}</span>
      <span class="score-strip-sep">–</span>
      <span class="score-strip-total${hActive ? ' active' : ''}">${g.homeTotal}</span>
      <span class="score-strip-team${hActive ? ' active' : ''}">${esc(g.homeName) || 'Home'}</span>
    </div>`;
}

function matchupPanel(g) {
  const pitcherTeam = g.pitchingSide === 'visitor' ? g.visitorName : g.homeName;
  const batterTeam = g.battingSide === 'visitor' ? g.visitorName : g.homeName;
  const onDeckP = g.onDeckPitchers && g.onDeckPitchers[0] ? g.onDeckPitchers[0].name : '';
  const onDeckB = g.onDeckBatters && g.onDeckBatters[0] ? g.onDeckBatters[0].name : '';
  return `
    <div class="matchup-panel">
      <div class="matchup-col">
        <span class="matchup-role">Pitching — ${esc(pitcherTeam) || '—'}</span>
        <span class="matchup-name">${esc(g.pitcherName) || '—'}</span>
        <span class="matchup-ondeck"><span class="od-label">On deck</span>${esc(onDeckP) || '—'}</span>
      </div>
      <div class="v-divider"></div>
      <div class="matchup-vs">VS</div>
      <div class="v-divider"></div>
      <div class="matchup-col">
        <span class="matchup-role">Batting — ${esc(batterTeam) || '—'}</span>
        <span class="matchup-name">${esc(g.batterName) || '—'}</span>
        <span class="matchup-ondeck"><span class="od-label">On deck</span>${esc(onDeckB) || '—'}</span>
      </div>
    </div>`;
}

function footer() {
  return `<footer class="board-footer"><span class="tagline">Have fun. Build community. Give back.</span></footer>`;
}

function render(g) {
  const board = document.getElementById('board');
  if (g.status === 'setup') {
    board.innerHTML = `${header(g)}<div class="board-body"><div class="empty-state">Awaiting game start</div></div>${footer()}`;
    return;
  }
  board.innerHTML =
    header(g) +
    `<div class="board-body">${scoreStrip(g)}${matchupPanel(g)}</div>` +
    footer();
}

pollEvery(5000, '/api/game', render);
</script>
</body>
</html>
